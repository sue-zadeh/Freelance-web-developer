name: Release Guardian

on:
  push:
    branches: [freelance--Challenge]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm run test

      - name: Build production application
        run: npm run build

      - name: Compare baseline and final controls
        run: npm run guardian:evaluate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
