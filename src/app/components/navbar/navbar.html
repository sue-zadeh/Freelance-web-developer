<header class="site-header">
  <nav class="shell nav-inner" aria-label="Main navigation">
    <a class="brand" href="/#home" aria-label="Sue Web Studio home" (click)="closeNavbar('home')"
      ><span class="brand-mark" aria-hidden="true">s<span>.</span></span
      ><span>Sue <strong>Web Studio</strong></span></a
    >
    <button
      id="menu-toggle"
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-navigation"
      (click)="menuOpen.set(!menuOpen())"
    >
      {{ menuOpen() ? 'Close' : 'Menu' }}
      <span aria-hidden="true">{{ menuOpen() ? '×' : '☰' }}</span>
    </button>
    <div id="main-navigation" class="nav-links" [class.is-open]="menuOpen()">
      <a
        href="/#services"
        [class.active]="activeSection() === 'services'"
        [attr.aria-current]="activeSection() === 'services' ? 'location' : null"
        (click)="closeNavbar('services')"
        >Services</a
      >
      <a
        href="/#projects"
        [class.active]="activeSection() === 'projects'"
        [attr.aria-current]="activeSection() === 'projects' ? 'location' : null"
        (click)="closeNavbar('projects')"
        >My work</a
      >
      <a
        href="/#about"
        [class.active]="activeSection() === 'about'"
        [attr.aria-current]="activeSection() === 'about' ? 'location' : null"
        (click)="closeNavbar('about')"
        >About Sue</a
      >
      <a class="nav-phone" href="tel:+64212049836">021 204 9836</a>
      <a class="button primary nav-cta" href="/#contact" (click)="closeNavbar('contact')"
        >Let’s talk <span aria-hidden="true">↗</span></a
      >
    </div>
  </nav>
</header>
